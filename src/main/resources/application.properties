spring.application.name=cartit-backend

server.port=${PORT:8080}

# =====================================================
# PostgreSQL
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cartit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d1e2f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# Cloudinary
# =====================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# =====================================================
# File Upload
# =====================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# DevTools
# =====================================================

spring.devtools.restart.enabled=false

# =====================================================
# SMS Gateway
# =====================================================

sms.enabled=${SMS_ENABLED:true}
sms.provider=${SMS_PROVIDER:fast2sms}

sms.fast2sms.api-key=${SMS_FAST2SMS_API_KEY:test_key}
sms.fast2sms.route=${SMS_FAST2SMS_ROUTE:otp}

# Twilio
sms.twilio.account-sid=${SMS_TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${SMS_TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${SMS_TWILIO_FROM_NUMBER:}

# 2Factor
sms.twofactor.api-key=${SMS_TWOFACTOR_API_KEY:}

# =====================================================
# Google Maps & Routing API
# =====================================================
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}