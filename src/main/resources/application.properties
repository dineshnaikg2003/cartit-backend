spring.application.name=cartit-backend

server.port=${PORT:8080}

# =====================================================
# PostgreSQL
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# Cloudinary
# =====================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =====================================================
# File Upload
# =====================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# DevTools
# =====================================================

spring.devtools.restart.enabled=false

# =====================================================
# SMS Gateway
# =====================================================

sms.enabled=${SMS_ENABLED:true}
sms.provider=${SMS_PROVIDER:fast2sms}

sms.fast2sms.api-key=${SMS_FAST2SMS_API_KEY}
sms.fast2sms.route=${SMS_FAST2SMS_ROUTE:otp}

# Twilio
sms.twilio.account-sid=${SMS_TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${SMS_TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${SMS_TWILIO_FROM_NUMBER:}

# 2Factor
sms.twofactor.api-key=${SMS_TWOFACTOR_API_KEY:}